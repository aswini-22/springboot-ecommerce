<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:replace="~{products :: header}"></header>

<main>
    <h2>All Orders</h2>
    <p th:if="${#lists.isEmpty(orders)}">No orders yet.</p>
    <table th:unless="${#lists.isEmpty(orders)}">
        <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Total</th><th></th></tr></thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}">1</td>
            <td th:text="${o.customerName}">Name</td>
            <td th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy HH:mm')}">date</td>
            <td>₹<span th:text="${#numbers.formatDecimal(o.total, 1, 'COMMA', 2, 'POINT')}">0</span></td>
            <td><a class="btn" th:href="@{/orders/{id}(id=${o.id})}">View</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
