<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Shop</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:fragment="header">
    <a class="brand" th:href="@{/}">🛒 Simple Shop</a>
    <nav>
        <a th:href="@{/}">Products</a>
        <a th:href="@{/cart}">Cart (<span th:text="${cartCount}">0</span>)</a>
        <a th:href="@{/orders}">Orders</a>
    </nav>
</header>

<main>
    <h2>Products</h2>
    <div class="grid">
        <div class="card" th:each="p : ${products}">
            <img th:src="${p.imageUrl}" th:alt="${p.name}">
            <div class="body">
                <h3 th:text="${p.name}">Name</h3>
                <p th:text="${p.description}">Description</p>
                <div class="price">₹<span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">0</span></div>
                <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post" style="margin-top:10px">
                    <button type="submit">Add to Cart</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
