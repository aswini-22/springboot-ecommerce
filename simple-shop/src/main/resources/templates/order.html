<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Confirmation</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:replace="~{products :: header}"></header>

<main>
    <div class="success">✅ Thank you, <span th:text="${order.customerName}">Customer</span>! Your order has been placed.</div>

    <h2>Order #<span th:text="${order.id}">1</span></h2>
    <p>Placed on <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">date</span></p>
    <p>Delivering to: <span th:text="${order.address}">address</span></p>

    <table>
        <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}">Name</td>
            <td>₹<span th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}">0</span></td>
            <td th:text="${item.quantity}">1</td>
            <td>₹<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}">0</span></td>
        </tr>
        </tbody>
    </table>
    <div class="total">Total: <strong>₹<span th:text="${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}">0</span></strong></div>
    <a class="btn" th:href="@{/}">Continue Shopping</a>
</main>
</body>
</html>
